plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.google.dagger.hilt.android")
    id("com.google.devtools.ksp")
    alias(libs.plugins.compose.compiler)
}

def debugApiBaseUrl = (project.findProperty("LOKSEWA_DEBUG_API_BASE_URL")
        ?: System.getenv("LOKSEWA_DEBUG_API_BASE_URL")
        ?: "http://10.0.2.2:8000/").toString()
def releaseApiBaseUrl = (project.findProperty("LOKSEWA_API_BASE_URL")
        ?: System.getenv("LOKSEWA_API_BASE_URL")
        ?: "https://api.loksewa.ai/").toString()

if (!releaseApiBaseUrl.startsWith("https://")) {
    throw new GradleException("LOKSEWA_API_BASE_URL must be HTTPS for release builds.")
}

android {
    namespace "com.loksewa.aiapp"
    compileSdk 36

    defaultConfig {
        applicationId "com.loksewa.aiapp"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ML Kit requires a unique application ID suffix for bundled models
        resValue "string", "app_name", "Loksewa AI"
        buildConfigField "String", "API_BASE_URL", "\"${releaseApiBaseUrl}\""
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            buildConfigField "String", "API_BASE_URL", "\"${debugApiBaseUrl}\""
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            minifyEnabled true
            buildConfigField "String", "API_BASE_URL", "\"${releaseApiBaseUrl}\""
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }


    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // Core Android
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.webkit:webkit:1.10.0"
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"

    // Jetpack Compose
    implementation platform("androidx.compose:compose-bom:2024.02.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "androidx.hilt:hilt-navigation-compose:1.2.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    // Room Database (for offline-first SQLite)
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    // Hilt Dependency Injection
    implementation "com.google.dagger:hilt-android:2.59.2"
    ksp "com.google.dagger:hilt-android-compiler:2.59.2"

    // Kotlin Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3"

    // Google ML Kit Text Recognition (OCR)
    implementation "com.google.mlkit:text-recognition:16.0.0"

    // CameraX (for camera integration)
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"

    // Retrofit (for API calls)
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // Coil (for image loading)
    implementation "io.coil-kt:coil-compose:2.5.0"

    // DataStore (for preferences)
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Testing
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}
