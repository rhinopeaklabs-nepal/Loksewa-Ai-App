<script>
        // Micro-interactions and Logic
        const shutter = document.getElementById('shutter');
        const flashToggle = document.getElementById('flashToggle');
        const flashIcon = document.getElementById('flashIcon');
        const loadingRing = document.getElementById('loadingRing');
        const progressCircle = document.getElementById('progressCircle');
        const textPreview = document.getElementById('textPreview');

        let isFlashOn = false;

        flashToggle.addEventListener('click', () => {
            isFlashOn = !isFlashOn;
            flashIcon.textContent = isFlashOn ? 'flash_on' : 'flash_off';
            flashToggle.classList.toggle('bg-primary-container', isFlashOn);
            flashToggle.classList.toggle('text-on-primary-container', isFlashOn);
        });

        shutter.addEventListener('click', () => {
            // Trigger capture effect
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 bg-white z-[60]';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.transition = 'opacity 0.3s ease-out';
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 300);
            }, 50);

            // Mock Scanning/OCR Pipeline
            startOcrSimulation();
        });

        function startOcrSimulation() {
            loadingRing.classList.remove('hidden');
            shutter.querySelector('.shutter-inner').style.opacity = '0.5';
            
            let progress = 0;
            const interval = setInterval(() => {
                progress += 5;
                const offset = 226 - (226 * progress / 100);
                progressCircle.style.strokeDashoffset = offset;
                
                if (progress === 30) {
                    textPreview.classList.remove('opacity-0');
                }

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        alert("Question Captured! Redirecting to Analysis...");
                        // In a real app: window.location.href = '/analysis?id=...';
                        resetScanner();
                    }, 500);
                }
            }, 50);
        }

        function resetScanner() {
            loadingRing.classList.add('hidden');
            shutter.querySelector('.shutter-inner').style.opacity = '1';
            textPreview.classList.add('opacity-0');
            progressCircle.style.strokeDashoffset = '226';
        }

        // Haptic feedback simulation
        shutter.addEventListener('mousedown', () => {
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        });
    </script>
