<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Loksewa AI - Quick Scan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .scan-line {
            animation: scan 3s ease-in-out infinite;
        }
        @keyframes scan {
            0%, 100% { top: 10%; opacity: 0.2; }
            50% { top: 90%; opacity: 0.8; }
        }
        .reticle-corner {
            width: 32px;
            height: 32px;
            border-color: #bdc2ff; /* primary */
        }

            darkMode: "class",
            theme: {
                extend: {

                        "inverse-surface": "#e5e2e1",

                        "surface-dim": "#131313",
                        "surface-container": "#201f1f",
                        "on-background": "#e5e2e1",
                        "secondary-fixed-dim": "#e9c176",
                        "on-primary-fixed": "#000767",
                        "on-secondary-fixed-variant": "#5d4201",
                        "surface-container-highest": "#353534",
                        "surface-container-high": "#2a2a2a",
                        "on-error": "#690005",
                        "error": "#ffb4ab",
                        "secondary": "#e9c176",
                        "background": "#131313",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#e0e0ff",
                        "inverse-primary": "#4c56af",
                        "tertiary-fixed": "#97f3e2",
                        "surface-container-low": "#1c1b1b",
                        "surface-tint": "#bdc2ff",
                        "outline-variant": "#454652",
                        "inverse-on-surface": "#313030",
                        "surface": "#131313",
                        "on-tertiary-fixed-variant": "#005047",
                        "on-primary": "#1b247f",
                        "on-tertiary": "#003730",
                        "on-tertiary-container": "#49a797",
                        "on-primary-fixed-variant": "#343d96",
                        "on-primary-container": "#8690ee",
                        "secondary-container": "#604403",
                        "surface-variant": "#353534",
                        "on-surface-variant": "#c6c5d4",
                        "outline": "#908f9d",
                        "tertiary-container": "#003730",
                        "on-tertiary-fixed": "#00201b",
                        "on-secondary-fixed": "#261900",
                        "on-secondary": "#412d00",
                        "surface-container-lowest": "#0e0e0e",
                        "on-surface": "#e5e2e1",
                        "primary-container": "#1a237e",
                        "surface-bright": "#393939",
                        "secondary-fixed": "#ffdea5",
                        "tertiary": "#7ad7c6",
                        "tertiary-fixed-dim": "#7ad7c6"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "unit": "8px",
                        "gutter": "24px",
                        "margin-mobile": "16px",
                        "container-max": "1280px",
                        "margin-desktop": "64px"

                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "label-sm": ["Noto Sans"],

                        "display-lg": ["Source Serif 4"],
                        "headline-md": ["Source Serif 4"],

                        "nepali-body": ["Noto Sans"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-sm": ["13px", {"lineHeight": "1", "letterSpacing": "0.04em", "fontWeight": "500"}],
                        "headline-md-mobile": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],

        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md overflow-hidden selection:bg-primary/30">
<!-- Top App Bar (Suppressing standard shell for task-focused view) -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center h-16 px-margin-mobile md:px-margin-desktop bg-gradient-to-b from-background/80 to-transparent backdrop-blur-sm transition-colors duration-200">
<button aria-label="Close scanner" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined text-on-surface">close</span>
</button>
<div class="flex items-center gap-4">
<button aria-label="Toggle flash" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/20 transition-colors" id="flash-toggle">
<span class="material-symbols-outlined text-on-surface">flash_off</span>
</button>
<button aria-label="Help" class="flex items-center justify-center p-2 rounded-full hover:bg-surface-variant/20 transition-colors">
<span class="material-symbols-outlined text-on-surface">help_outline</span>
</button>
</div>
</header>
<!-- Main Camera Viewport -->
<main class="relative h-screen w-full flex flex-col items-center justify-center bg-black overflow-hidden">
<!-- Mock Camera Background -->
<div class="absolute inset-0 z-0">
<img alt="Camera Viewfinder" class="w-full h-full object-cover opacity-60 grayscale-[0.2]" data-alt="A POV perspective of a high-resolution smartphone camera viewfinder focusing on a page of a complex legal textbook. The text is dense and printed on high-quality cream-colored paper with several highlighted passages in soft yellow. The lighting is focused and professional, suggesting a scholarly environment. The overall aesthetic is dark and academic, with deep shadows and sharp focus on the central text block." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHXehV33cxuykyrvQedtgnUs7QmzTbs7keJPvkC0koxWST69zNbJv51SERqqNplv0YjJ-rtMB_XidgkrHBLEZip4clcHMJqvzrf5J9WReMmFnG3cYPpbOHa3whCPktsBHwtbMIE7tPOZpnq6FzisA7wCpqGPDwOCqUi1Xz-3U4XjI4RZcLka72zcmeHHq9FWtQtM5jk_9xf7Driq3TS0S9_27tNaZmSwBV4RYFi83Pn0zAEE2OiMoYQeoqy0oBz0GEKg_uoev55aI"/>
</div>
<!-- Scanning Overlay / Mask -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center">
<!-- Semi-transparent Vignette -->
<div class="absolute inset-0 bg-black/40"></div>
<!-- Focused Scanning Area -->
<div class="relative w-[85%] max-w-[400px] aspect-[3/4] rounded-xl overflow-hidden ring-1 ring-white/10 shadow-2xl">
<!-- Clear area inside mask -->
<div class="absolute inset-0 bg-transparent shadow-[0_0_0_9999px_rgba(0,0,0,0.5)]"></div>
<!-- Reticle Corners -->
<div class="absolute top-0 left-0 reticle-corner border-t-4 border-l-4 rounded-tl-xl"></div>
<div class="absolute top-0 right-0 reticle-corner border-t-4 border-r-4 rounded-tr-xl"></div>
<div class="absolute bottom-0 left-0 reticle-corner border-b-4 border-l-4 rounded-bl-xl"></div>
<div class="absolute bottom-0 right-0 reticle-corner border-b-4 border-r-4 rounded-br-xl"></div>
<!-- Scanning Line -->
<div class="scan-line absolute left-0 right-0 h-1 bg-gradient-to-r from-transparent via-primary to-transparent blur-[1px]"></div>
</div>
<!-- Overlay Text Instructions -->
<div class="mt-8 px-6 py-2 rounded-full bg-surface-container-highest/80 backdrop-blur-md border border-outline-variant/30 transition-all">
<p class="text-on-surface font-label-sm uppercase tracking-widest text-center">
                    ALIGN QUESTION WITHIN THE FRAME
                </p>
</div>
</div>
</main>
<!-- Bottom Action Console -->
<footer class="fixed bottom-0 w-full z-50 flex flex-col items-center pb-safe">
<!-- AI Badge Logic (AI-Assisted scanning) -->
<div class="mb-6 flex items-center gap-2 px-3 py-1 bg-primary/10 border border-primary/20 rounded-full">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="text-[12px] font-medium text-primary tracking-tight">AI ENHANCED SCANNING</span>
</div>
<div class="w-full bg-gradient-to-t from-background/95 via-background/80 to-transparent px-margin-mobile md:px-margin-desktop h-32 flex justify-between items-center">
<!-- Manual Entry -->
<button class="flex flex-col items-center gap-1 group w-20">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high group-hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-on-surface-variant">keyboard</span>
</div>
<span class="text-[11px] font-medium text-on-surface-variant uppercase tracking-tighter">Manual</span>
</button>
<!-- Primary Capture Button -->
<div class="relative flex items-center justify-center">
<!-- Inner Ring -->
<button class="w-20 h-20 bg-white rounded-full flex items-center justify-center ring-4 ring-white/20 active:scale-90 transition-transform duration-100 shadow-xl group" id="capture-btn">
<div class="w-16 h-16 border-2 border-background rounded-full"></div>
</button>
</div>
<!-- Gallery -->
<button class="flex flex-col items-center gap-1 group w-20">
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high group-hover:bg-surface-variant transition-colors overflow-hidden border border-outline-variant/20">
<img alt="Gallery preview" class="w-full h-full object-cover" data-alt="A small square thumbnail image showing a close-up of handwritten notes on a legal pad with a fountain pen resting on top. The mood is scholastic and orderly. The thumbnail has a soft, muted color palette with deep blues and whites, consistent with a high-end educational application's dark mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBD86yokZ_AVM9j455zQ5RgpDInHMbSMnsJ0EjwvGRJ4iBHbmmwJQw6AeDXo67jrKLYAYWLVOW6qYGbTBiMD-BIbSa13fX3W3F4bkcf0sq9AUlT34BJ9EHVgP5D4OrhkakCxSvdCurrncMmVDqmpg0vO0bDxw9zLyeQCy4ZH8mB4Y8HmoMcqYepHCu5sZMmkeheKgmDdLwgRsoYiKbrQzyrySxSCB0vdkLl5RdGmNQmyboh-ia7_7x1Zv70fxlUD9DZAi1oOLztR-k"/>
</div>
<span class="text-[11px] font-medium text-on-surface-variant uppercase tracking-tighter">Gallery</span>
</button>
</div>
</footer>
<!-- Interactive Micro-Interactions -->
<script>
        const captureBtn = document.getElementById('capture-btn');
        const flashBtn = document.getElementById('flash-toggle');
        let flashOn = false;

        captureBtn.addEventListener('click', () => {
            // Flash effect
            const flashOverlay = document.createElement('div');
            flashOverlay.className = 'fixed inset-0 bg-white z-[100] opacity-0 transition-opacity duration-75';
            document.body.appendChild(flashOverlay);
            
            setTimeout(() => flashOverlay.style.opacity = '0.8', 0);
            setTimeout(() => {
                flashOverlay.style.opacity = '0';
                setTimeout(() => document.body.removeChild(flashOverlay), 75);
            }, 75);

            // Simulate haptic/interaction
            console.log("Analyzing text frame...");
        });

        flashBtn.addEventListener('click', () => {
            flashOn = !flashOn;
            const icon = flashBtn.querySelector('span');
            icon.textContent = flashOn ? 'flash_on' : 'flash_off';
            icon.classList.toggle('text-primary', flashOn);
            flashBtn.classList.toggle('bg-primary/10', flashOn);
        });

        // Simple mouse tracking for a subtle perspective shift on the reticle (Desktop only)
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const reticle = document.querySelector('.relative.w-\\[85\\%\\]');
                const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
                reticle.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });
        }
    </script>
</body></html>
