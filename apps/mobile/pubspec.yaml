name: loksewa_ai_app
description: "Loksewa AI — Flutter mobile app for Nepal's AI-powered civil service exam preparation"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Storage
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.2.0
  confetti: ^0.7.0
  lottie: ^3.1.0
  flutter_animate: ^4.4.0
  glassmorphism: ^3.0.0
  percent_indicator: ^4.2.3
  readmore: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  timeline_tile: ^2.0.0

  # Charts & Data Viz
  fl_chart: ^0.68.0
  syncfusion_flutter_charts: ^24.1.41

  # Markdown / Rich text
  flutter_markdown: ^0.7.3
  markdown: ^7.1.1

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.0
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  path_provider: ^2.1.3
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Features
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.13.0
  permission_handler: ^11.3.0
  connectivity_plus: ^6.0.0
  firebase_messaging: ^15.0.0
  firebase_core: ^3.3.0
  firebase_analytics: ^11.1.0
  local_auth: ^2.2.0
  audioplayers: ^6.0.0
  vibration: ^2.0.0
  flutter_local_notifications: ^17.2.0
  app_badge_control: ^1.1.3
  in_app_purchase: ^3.1.13
  speech_to_text: ^7.0.0
  record: ^5.1.2

  # Pull to refresh, animations
  pull_to_refresh: ^2.0.0
  rive: ^0.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  mockito: ^5.4.4
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/sounds/

  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
