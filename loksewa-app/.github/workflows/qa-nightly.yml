name: QA Automation - Nightly / Release

on:
  schedule:
    - cron: '0 0 * * *' # Midnight every day
  workflow_dispatch: # Manual trigger

jobs:
  backend-and-web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install && cd qa && pnpm install

      - name: Install Playwright Browsers
        working-directory: ./qa
        run: npx playwright install --with-deps

      - name: Run Web & API Tests
        working-directory: ./qa
        run: |
          pnpm run test:web || true
          pnpm run test:api || true

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Run Performance Tests
        working-directory: ./qa
        run: pnpm run test:perf || true

      - name: Upload Core Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-core
          path: qa/allure-results

  mobile-tests-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run Maestro Android Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          script: |
            export PATH="$PATH":"$HOME/.maestro/bin"
            # Build and install flutter app here (pseudo code for workflow)
            cd apps/mobile && flutter build apk --debug
            adb install build/app/outputs/flutter-apk/app-debug.apk
            cd ../../qa/e2e-mobile
            mkdir -p ../allure-results
            maestro test logout-flow.yaml --format junit --output ../allure-results/report-android.xml || true

      - name: Upload Android Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-android
          path: qa/allure-results

  mobile-tests-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run Maestro iOS Tests on Simulator
        run: |
          export PATH="$PATH":"$HOME/.maestro/bin"
          # Boot iOS simulator
          xcrun simctl boot "iPhone 15" || true
          # Build and install
          cd apps/mobile && flutter build ios --simulator
          xcrun simctl install booted build/ios/iphonesimulator/Runner.app
          cd ../../qa/e2e-mobile
          mkdir -p ../allure-results
          maestro test logout-flow.yaml --format junit --output ../allure-results/report-ios.xml || true

      - name: Upload iOS Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-ios
          path: qa/allure-results

  publish-report:
    needs: [backend-and-web-tests, mobile-tests-android, mobile-tests-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all Allure Results
        uses: actions/download-artifact@v4
        with:
          path: qa/allure-results
          pattern: allure-results-*
          merge-multiple: true

      - name: Setup Allure
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        working-directory: ./qa
        run: allure generate ./allure-results -o ./allure-report --clean

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./qa/allure-report
          destination_dir: QA_Report
