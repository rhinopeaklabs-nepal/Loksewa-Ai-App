name: 🛡️ PR Quality Gate

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for SonarCloud

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Install Python deps
        run: pip install -r requirements.txt pytest pytest-cov ruff

      - name: Run backend tests
        run: pytest tests/ -v --tb=short

      - name: Run ruff lint
        run: ruff check backend/ tests/

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Compile Kotlin (fast check)
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { context } = require('@actions/github');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `### ✅ Quality Gate Complete\n\n| Check | Status |\n|-------|--------|\n| Backend Tests | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |\n| Python Lint | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |\n| Android Lint | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |\n| Kotlin Compile | ${{ job.status == 'success' && '✅ Pass' || '❌ Fail' }} |`
            });
