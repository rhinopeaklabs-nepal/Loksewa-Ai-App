name: PR Quality Gate

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

jobs:
  quality-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Typecheck backend
        run: npm run typecheck
        working-directory: backend

      - name: Test backend
        run: npm test
        working-directory: backend

      - name: Build backend
        run: npm run build
        working-directory: backend

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon

      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --no-daemon

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { context } = require('@actions/github');
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              body: `### Quality Gate Complete\n\n| Check | Status |\n|-------|--------|\n| Node Backend | ${{ job.status == 'success' && 'Pass' || 'Fail' }} |\n| Android Lint | ${{ job.status == 'success' && 'Pass' || 'Fail' }} |\n| Kotlin Compile | ${{ job.status == 'success' && 'Pass' || 'Fail' }} |`
            });
