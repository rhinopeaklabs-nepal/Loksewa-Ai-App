# Project-wide Gradle settings.
# AGP 9.x — disable built-in Kotlin to keep org.jetbrains.kotlin.android plugin
# (required because Hilt 2.59.2 has known incompatibility with KSP2 — dagger#4505)

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Suppress warning for using compileSdk 36 with newer AGP versions
android.suppressUnsupportedCompileSdk=36

# Enable AGP built-in Kotlin and KSP2 support
android.experimental.builtInKotlin=true

